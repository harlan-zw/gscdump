catalogMode: prefer
minimumReleaseAgeExclude:
  - '@cloudflare/workers-types@4.20260527.1'
  - '@nuxt/nitro-server@4.4.6'
  - '@nuxt/vite-builder@4.4.6'
  - '@types/node@25.9.0'
  - nuxt@4.4.6
  - tsx@4.22.2
  - icebird@0.8.13
  - retriv@0.14.7
  - nuxt-use-query@0.2.7 || 0.3.0 || 0.7.1
shellEmulator: true

trustPolicy: no-downgrade
# chokidar@4 dropped provenance attestation that 3.x had. It's pulled only
# by Nuxt's vite-plugin-checker in the Nuxt dashboard example — dev-only,
# Node-side file watcher. Accept the downgrade rather than pinning chokidar
# across the whole workspace.
trustPolicyExclude:
  - chokidar
  - semver
packages:
  - packages/*
  - examples/nuxt-dashboard
overrides:
  '@eslint/plugin-kit': ^0.7.2
  '@nuxt/kit': 4.4.4
  '@nuxt/schema': 4.4.4
  '@types/node>undici-types': ^7.0.0
  tinyexec: 1.1.2
patchedDependencies:
  hyparquet-writer@0.16.1: patches/hyparquet-writer@0.16.1.patch
  icebird@0.8.13: patches/icebird@0.8.13.patch
catalog:
  '@cloudflare/vitest-pool-workers': ^0.18.0
  '@cloudflare/workers-types': ^5.20260706.1
  '@duckdb/duckdb-wasm': ^1.32.0
