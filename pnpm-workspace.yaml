catalogMode: prefer
minimumReleaseAgeExclude:
  - '@cloudflare/workers-types@4.20260519.1'
  - '@nuxt/nitro-server@4.4.6'
  - '@nuxt/vite-builder@4.4.6'
  - '@types/node@25.9.0'
  - nuxt@4.4.6
  - tsx@4.22.2
  - icebird@0.8.5
  - retriv@0.14.7
  - nuxt-use-query@0.2.4
  - nuxt-use-query@0.2.7
shellEmulator: true

trustPolicy: no-downgrade
# chokidar@4 dropped provenance attestation that 3.x had. It's pulled only
# by Nuxt's vite-plugin-checker in the Nuxt dashboard example — dev-only,
# Node-side file watcher. Accept the downgrade rather than pinning chokidar
# across the whole workspace.
trustPolicyExclude:
  - chokidar
  - semver
packages:
  - packages/*
  - examples/nuxt-dashboard
overrides:
  '@eslint/plugin-kit': ^0.7.1
  '@nuxt/kit': 4.4.4
  '@nuxt/schema': 4.4.4
  '@types/node>undici-types': ^7.0.0
  tinyexec: 1.1.2
patchedDependencies:
  icebird@0.8.5: patches/icebird@0.8.5.patch
catalog:
  '@cloudflare/workers-types': ^4.20260524.1
  '@duckdb/duckdb-wasm': ^1.32.0
  '@duckdb/node-api': 1.5.1-r.2
  '@huggingface/transformers': ^4.2.0
  '@modelcontextprotocol/sdk': ^1.29.0
  '@nuxt/kit': ^4.4.6
  '@nuxt/ui': ^4.8.0
  '@types/js-yaml': ^4.0.9
  '@types/node': ^25.9.1
  '@types/proper-lockfile': ^4.1.4
  '@unovis/ts': ^1.6.5
  '@unovis/vue': ^1.6.5
  '@uwdata/flechette': ^2.5.0
  '@vueuse/core': ^14.3.0
  '@vueuse/nuxt': ^14.3.0
  aws4fetch: ^1.0.20
  drizzle-orm: ^0.45.2
  h3: ^1.15.11
  hyparquet: ^1.26.0
  hyparquet-writer: ^0.15.2
  icebird: ^0.8.5
  js-yaml: ^4.1.1
  nuxt: ^4.4.6
  nuxt-use-query: ^0.2.7
  retriv: ^0.14.7
  tailwindcss: ^4.3.0
  tsx: ^4.22.3
  vitest-package-exports: ^1.2.0
  vue: ^3.5.34
  zod: ^4.4.3
catalogs:
  deps:
    '@clack/prompts': ^1.4.0
    '@googleapis/indexing': ^6.0.1
    '@googleapis/searchconsole': ^6.0.1
    citty: ^0.2.2
    consola: ^3.4.2
    date-fns: ^4.3.0
    defu: ^6.1.7
    google-auth-library: ^10.6.2
    ofetch: ^1.5.1
    open: ^11.0.0
    proper-lockfile: ^4.1.2
    ufo: ^1.6.4
  dev-build:
    bumpp: ^11.1.0
    obuild: ^0.4.36
    typescript: ^6.0.3
  dev-lint:
    '@antfu/eslint-config': ^9.0.0
    eslint: ^10.4.0
  dev-test:
    '@nuxt/test-utils': ^4.0.3
    vitest: ^4.1.7
onlyBuiltDependencies:
  - '@parcel/watcher'
  - esbuild
  - gtoken
  - unrs-resolver
  - vue-demi
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  maplibre-gl: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true
  vue-demi: true
