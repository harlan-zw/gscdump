catalogMode: prefer

minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@cloudflare/workers-types@5.20260910.1'
  - '@rolldown/binding-android-arm-eabi@1.2.8'
  - '@rolldown/binding-android-arm64@1.2.8'
  - '@rolldown/binding-darwin-arm64@1.2.8'
  - '@rolldown/binding-darwin-x64@1.2.8'
  - '@rolldown/binding-freebsd-x64@1.2.8'
  - '@rolldown/binding-linux-arm-gnueabihf@1.2.8'
  - '@rolldown/binding-linux-arm64-gnu@1.2.8'
  - '@rolldown/binding-linux-arm64-musl@1.2.8'
  - '@rolldown/binding-linux-ppc64-gnu@1.2.8'
  - '@rolldown/binding-linux-s390x-gnu@1.2.8'
  - '@rolldown/binding-linux-x64-gnu@1.2.8'
  - '@rolldown/binding-linux-x64-musl@1.2.8'
  - '@rolldown/binding-openharmony-arm64@1.2.8'
  - '@rolldown/binding-win32-arm64-msvc@1.2.8'
  - '@rolldown/binding-win32-x64-msvc@1.2.8'
  - rolldown@1.2.8
  - zod@4.6.1
  - '@modelcontextprotocol/sdk@1.30.1'
  - hono@4.13.9

trustPolicy: no-downgrade
# chokidar@4 dropped provenance attestation that 3.x had. It's pulled only
# by Nuxt's vite-plugin-checker in the Nuxt dashboard example — dev-only,
# Node-side file watcher. Accept the downgrade rather than pinning chokidar
# across the whole workspace.
trustPolicyExclude:
  - chokidar
  - semver

shellEmulator: true

packages:
  - packages/*
  - examples/nuxt-dashboard

overrides:
  '@eslint/plugin-kit': ^0.7.3
  '@nuxt/kit': 4.5.2
  '@nuxt/schema': 4.5.2
  '@types/node>undici-types': ^7.29.1
  hono: ^4.13.9
  tinyexec: ^1.3.1

patchedDependencies:
  hyparquet-writer@0.16.10: patches/hyparquet-writer@0.16.10.patch
  icebird@0.8.30: patches/icebird@0.8.30.patch

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  maplibre-gl: true
  onnxruntime-node: false
  protobufjs: true
  sharp: true
  vue-demi: true
  workerd: true

onlyBuiltDependencies:
  - '@parcel/watcher'
  - esbuild
  - gtoken
  - unrs-resolver
  - vue-demi
  - workerd

catalog:
  '@cloudflare/vitest-pool-workers': ^0.22.0
  '@cloudflare/workers-types': ^5.20260923.1
  '@duckdb/duckdb-wasm': 1.33.1-dev57.0
  '@duckdb/node-api': 1.5.5-r.5
  '@modelcontextprotocol/sdk': ^1.30.1
  '@nuxt/schema': 4.5.2
  '@nuxt/ui': ^4.11.2
  '@types/node': ^26.6.2
  '@types/proper-lockfile': ^4.1.4
  '@unovis/ts': ^1.7.0
  '@unovis/vue': ^1.7.0
  '@vitest/browser-playwright': ^5.0.1
  '@vueuse/core': ^15.0.0
  aws4fetch: ^1.0.20
  drizzle-orm: 1.0.0-rc.4
  hyparquet: ^1.31.1
  hyparquet-writer: ^0.16.10
  icebird: ^0.8.30
  js-yaml: ^5.4.2
  nuxt: ^4.5.2
  nuxt-use-query: ^1.0.1
  pathe: ^2.0.3
  playwright: ^1.63.0
  pluralize: ^8.0.0
  retriv: ^0.15.0
  sitemapd: ^0.2.2
  string-width: ^8.2.2
  tailwindcss: ^4.3.3
  tsx: ^4.23.15
  unstorage: ^1.17.5
  vitest-package-exports: ^1.2.0
  vue: ^3.5.43
  wrangler: ^4.136.3
  zod: ^4.6.5

catalogs:
  deps:
    '@clack/prompts': ^1.8.1
    citty: ^0.2.2
    consola: ^3.4.2
    google-auth-library: ^11.1.0
    ofetch: ^1.5.1
    open: ^11.0.4
    proper-lockfile: ^4.1.2
  dev-build:
    '@typescript/native': npm:typescript@^7.0.2
    bumpp: ^12.3.0
    obuild: ^0.4.40
    rolldown: ^1.2.9
    typescript: npm:@typescript/typescript6@^6.0.2
  dev-lint:
    '@antfu/eslint-config': ^9.5.1
    eslint: ^10.11.0
  dev-test:
