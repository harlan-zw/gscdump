catalogMode: prefer
shellEmulator: true

trustPolicy: no-downgrade
# chokidar@4 dropped provenance attestation that 3.x had. It's pulled only
# by Nuxt's vite-plugin-checker in the Nuxt dashboard example — dev-only,
# Node-side file watcher. Accept the downgrade rather than pinning chokidar
# across the whole workspace.
trustPolicyExclude:
  - chokidar
  - semver
packages:
  - packages/*
  - examples/nuxt-dashboard
overrides:
  '@types/node>undici-types': ^7.0.0
catalog:
  '@cloudflare/workers-types': ^4.20260430.1
  '@duckdb/duckdb-wasm': ^1.32.0
  '@duckdb/node-api': 1.5.1-r.2
  '@huggingface/transformers': ^4.2.0
  '@modelcontextprotocol/sdk': ^1.29.0
  '@nuxt/ui': ^4.7.1
  '@types/js-yaml': ^4.0.9
  '@types/node': ^25.6.0
  '@types/proper-lockfile': ^4.1.4
  '@unovis/ts': ^1.6.5
  '@unovis/vue': ^1.6.5
  '@vueuse/core': ^14.2.1
  '@vueuse/nuxt': ^14.2.1
  aws4fetch: ^1.0.20
  drizzle-orm: ^0.45.2
  h3: ^1.15.11
  hyparquet: ^1.25.6
  hyparquet-writer: ^0.14.0
  js-yaml: ^4.1.1
  nuxt: ^4.4.4
  tailwindcss: ^4.2.4
  tsx: ^4.21.0
  vitest-package-exports: ^1.2.0
  vue: ^3.5.33
  zod: ^4.4.1
catalogs:
  deps:
    '@clack/prompts': ^1.3.0
    '@googleapis/indexing': ^6.0.1
    '@googleapis/searchconsole': ^6.0.1
    citty: ^0.2.2
    consola: ^3.4.2
    dayjs: ^1.11.20
    defu: ^6.1.7
    google-auth-library: ^10.6.2
    ofetch: ^1.5.1
    open: ^11.0.0
    proper-lockfile: ^4.1.2
    ufo: ^1.6.4
  dev-build:
    bumpp: ^11.0.1
    obuild: ^0.4.33
    typescript: ^6.0.3
  dev-lint:
    '@antfu/eslint-config': ^8.2.0
    eslint: ^10.2.1
  dev-test:
    '@nuxt/test-utils': ^4.0.3
    vitest: ^4.1.5
onlyBuiltDependencies:
  - '@parcel/watcher'
  - esbuild
  - gtoken
  - unrs-resolver
  - vue-demi
