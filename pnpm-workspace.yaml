catalogMode: prefer
minimumReleaseAgeExclude:
  - '@cloudflare/workers-types@4.20260527.1'
  - '@nuxt/nitro-server@4.4.6'
  - '@nuxt/vite-builder@4.4.6'
  - '@types/node@25.9.0'
  - nuxt@4.4.6
  - tsx@4.22.2
  - icebird@0.8.15
  - retriv@0.14.7
  - nuxt-use-query@0.2.7 || 0.3.0 || 0.7.1 || 1.0.0 || 1.0.1
  - sitemapd@0.1.0 || 0.2.0
shellEmulator: true

trustPolicy: no-downgrade
# chokidar@4 dropped provenance attestation that 3.x had. It's pulled only
# by Nuxt's vite-plugin-checker in the Nuxt dashboard example — dev-only,
# Node-side file watcher. Accept the downgrade rather than pinning chokidar
# across the whole workspace.
trustPolicyExclude:
  - chokidar
  - semver
packages:
  - packages/*
  - examples/nuxt-dashboard
overrides:
  '@eslint/plugin-kit': ^0.7.2
  '@nuxt/kit': 4.5.2
  '@nuxt/schema': 4.5.2
  '@types/node>undici-types': ^7.0.0
  hono: 4.12.31
  icebird>hyparquet-writer: 0.16.9
  tinyexec: 1.1.2
  typescript: 6.0.3
patchedDependencies:
  hyparquet-writer@0.16.9: patches/hyparquet-writer@0.16.9.patch
  icebird@0.8.27: patches/icebird@0.8.27.patch
catalog:
  '@cloudflare/vitest-pool-workers': ^0.22.0
  '@cloudflare/workers-types': ^5.20260831.1
  '@duckdb/duckdb-wasm': 1.33.1-dev57.0
  '@duckdb/node-api': 1.5.1-r.2
  '@modelcontextprotocol/sdk': ^1.30.0
  '@nuxt/schema': 4.5.2
  '@nuxt/ui': ^4.11.0
  '@types/node': ^26.4.0
  '@types/proper-lockfile': ^4.1.4
  '@unovis/ts': ^1.6.7
  '@unovis/vue': ^1.6.7
  '@vitest/browser-playwright': ^4.1.11
  '@vueuse/core': ^14.4.0
  aws4fetch: ^1.0.20
  drizzle-orm: 1.0.0-rc.4
  hyparquet: ^1.29.2
  hyparquet-writer: ^0.16.9
  icebird: ^0.8.27
  js-yaml: ^5.4.1
  nuxt: ^4.5.2
  nuxt-use-query: ^1.0.1
  pathe: ^2.0.3
  playwright: ^1.62.1
  pluralize: ^8.0.0
  retriv: ^0.15.0
  sitemapd: ^0.2.2
  tailwindcss: ^4.3.3
  tsx: ^4.23.13
  unstorage: ^1.17.5
  vitest-package-exports: ^1.2.0
  vue: ^3.5.42
  wrangler: ^4.127.1
  zod: ^4.5.4
catalogs:
  deps:
    '@clack/prompts': ^1.7.0
    citty: ^0.2.2
    consola: ^3.4.2
    google-auth-library: ^11.0.2
    ofetch: ^1.5.1
    open: ^11.0.2
    proper-lockfile: ^4.1.2
  dev-build:
    bumpp: ^12.2.2
    obuild: ^0.4.38
    rolldown: ^1.2.6
    typescript: ^7.0.2
  dev-lint:
    '@antfu/eslint-config': ^9.3.0
    eslint: ^10.9.1
  dev-test:
    '@nuxt/test-utils': ^4.2.0
    '@vitest/browser': ^4.1.11
    vitest: ^4.1.11
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  maplibre-gl: true
  onnxruntime-node: false
  protobufjs: true
  sharp: true
  vue-demi: true
  workerd: true
onlyBuiltDependencies:
