name: Test

on:
  push:
    # A branch filter prevents release tags from running this workflow again.
    # The commit was already tested by its branch push, while the tag has its
    # own release workflow.
    branches:
      - '**'
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - LICENSE

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: pnpm

      # Install the workspace root and publishable packages only. The Nuxt
      # example has its own dependency tree and postinstall preparation.
      - run: pnpm i --filter . --filter "./packages/*" --frozen-lockfile --trust-lockfile
        env:
          PNPM_MINIMUM_RELEASE_AGE: 0

      - name: Lint
        run: pnpm lint

      - name: Build
        # The private Nuxt dashboard example is not published and added about
        # 55 seconds to every package CI run. Its focused e2e suite remains
        # available via `pnpm test:e2e`.
        run: pnpm --filter "./packages/*" run build

      # Export snapshots and hosted contracts were the recurring late failures
      # in the usage-report window. Run this cheap subset first so contract
      # drift fails before the four-minute full suite.
      - name: Fast contract checks
        run: pnpm exec vitest run tests/exports.test.ts packages/contracts/test/contracts.test.ts

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
