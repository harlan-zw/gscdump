name: Perf Comment

# Posts the report Perf Pull Request produced. It runs after that workflow, so
# it holds the write token and the pull request's own code never does. Every
# value it trusts is checked against the workflow run before it is used.
on:
  workflow_run:
    workflows:
      - Perf Pull Request
    types:
      - completed

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions: {}

jobs:
  comment:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    permissions:
      actions: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the pull request
        id: pull-request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const run = context.payload.workflow_run
            const headOwner = run.head_repository?.owner?.login
            if (!headOwner || !run.head_branch) {
              core.setFailed('The workflow run is missing its head repository or branch')
              return
            }

            const { data: pullRequests } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${headOwner}:${run.head_branch}`,
              per_page: 100,
            })
            const matches = pullRequests.filter(pullRequest =>
              pullRequest.state === 'open'
              && pullRequest.head.sha === run.head_sha
              && pullRequest.head.repo?.full_name === run.head_repository.full_name
              && pullRequest.base.repo.full_name === `${context.repo.owner}/${context.repo.repo}`,
            )

            if (matches.length !== 1) {
              core.setFailed(`Expected one open pull request for ${run.head_sha}, found ${matches.length}`)
              return
            }

            core.setOutput('number', matches[0].number)

      - name: Download the report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: perf-report
          path: ${{ runner.temp }}/perf-report
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Check the report before trusting it
        env:
          COMMENT_PATH: ${{ runner.temp }}/perf-comment.md
          EXPECTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          EXPECTED_PR_NUMBER: ${{ steps.pull-request.outputs.number }}
          REPORT_DIR: ${{ runner.temp }}/perf-report
        run: |
          set -euo pipefail
          report="$REPORT_DIR/report.md"
          pr_number="$REPORT_DIR/pr-number.txt"
          head_sha="$REPORT_DIR/head-sha.txt"

          for file in "$report" "$pr_number" "$head_sha"; do
            if [ ! -f "$file" ] || [ -L "$file" ]; then
              echo "::error::Missing or invalid report file: $file"
              exit 1
            fi
          done

          if [ "$(wc -c < "$pr_number")" -gt 16 ] || [ "$(wc -c < "$head_sha")" -gt 64 ]; then
            echo "::error::Report metadata is too large"
            exit 1
          fi

          if ! grep -Eq '^[0-9]+$' "$pr_number" \
            || [ "$(tr -d '\r\n' < "$pr_number")" != "$EXPECTED_PR_NUMBER" ]; then
            echo "::error::The report names a different pull request than the workflow run"
            exit 1
          fi

          if [ "$(tr -d '\r\n' < "$head_sha")" != "$EXPECTED_HEAD_SHA" ]; then
            echo "::error::The report names a different head commit than the workflow run"
            exit 1
          fi

          size=$(wc -c < "$report")
          if [ "$size" -lt 1 ] || [ "$size" -gt 131072 ]; then
            echo "::error::The report must be between 1 byte and 128 KiB"
            exit 1
          fi

          if [ "$(head -n 1 "$report")" != '### ⚡ Perf' ]; then
            echo "::error::The report has an unexpected format"
            exit 1
          fi

          if [ -e "$COMMENT_PATH" ] || [ -L "$COMMENT_PATH" ]; then
            echo "::error::Refusing to overwrite the checked comment path"
            exit 1
          fi
          # A benchmark id is repository content, so it could carry a mention.
          sed 's/@/@<!-- -->/g' "$report" > "$COMMENT_PATH"

      - name: Post the comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          COMMENT_PATH: ${{ runner.temp }}/perf-comment.md
          PR_NUMBER: ${{ steps.pull-request.outputs.number }}
        with:
          script: |
            const { readFileSync } = require('node:fs')

            // GitHub returns transient 5xx, 429, and network errors. Retry
            // those. Anything else fails the step at once.
            async function withRetry(label, call) {
              for (let attempt = 1; ; attempt++) {
                try {
                  return await call()
                }
                catch (error) {
                  const status = error.status
                  const transient = status === undefined || status === 429 || status >= 500
                  if (!transient || attempt >= 5)
                    throw error
                  const wait = Math.min(2000 * 2 ** (attempt - 1), 30000)
                  core.warning(`${label} hit a transient error (${error.message}). Retrying in ${wait}ms.`)
                  await new Promise(resolve => setTimeout(resolve, wait))
                }
              }
            }

            const { owner, repo } = context.repo
            const issueNumber = Number(process.env.PR_NUMBER)
            const marker = '<!-- perf-report -->'
            const body = `${readFileSync(process.env.COMMENT_PATH, 'utf8')}\n${marker}`

            const comments = await withRetry('issues.listComments', () =>
              github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: issueNumber,
                per_page: 100,
              }),
            )
            const existing = comments.find(comment => comment.body?.includes(marker))

            if (!existing) {
              await withRetry('issues.createComment', () =>
                github.rest.issues.createComment({ owner, repo, issue_number: issueNumber, body }),
              )
              core.info(`Posted the perf comment on #${issueNumber}`)
              return
            }

            if (existing.body === body) {
              core.info('The perf comment is unchanged. Leaving it alone.')
              return
            }

            await withRetry('issues.updateComment', () =>
              github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body }),
            )
            core.info(`Updated the perf comment on #${issueNumber}`)
