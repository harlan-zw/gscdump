name: Release

permissions:
  contents: write
  id-token: write

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: npx changelogithub
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

      - run: pnpm i
        env:
          PNPM_MINIMUM_RELEASE_AGE: 0

      # `@gscdump/engine` bundles ~20 entries via obuild; on the GitHub-hosted
      # ubuntu runner the default Node heap (~2 GB) OOM'd during v0.5.0, even
      # though the same build peaks at ~2.9 GB locally. Lift the cap so the
      # release isn't gated on heap pressure.
      - run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      # Each package's `prepack` re-runs `pnpm run build`, which OOMs at
      # the default 2 GB heap (same root cause as the build step above).
      - run: pnpm publish -r --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{secrets.NPM_TOKEN}}
          NODE_OPTIONS: --max-old-space-size=6144
