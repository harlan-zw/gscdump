name: Release

permissions:
  contents: read

on:
  push:
    tags: ['v*']

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a release from main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm i --filter . --filter "./packages/*" --frozen-lockfile --trust-lockfile
        env:
          PNPM_MINIMUM_RELEASE_AGE: 0
      - run: pnpm --filter @gscdump/engine-duckdb-wasm exec playwright install --with-deps chromium
      - run: pnpm check:release
        env:
          NODE_OPTIONS: --max-old-space-size=6144

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm i --filter . --filter "./packages/*" --frozen-lockfile --trust-lockfile
        env:
          PNPM_MINIMUM_RELEASE_AGE: 0
      - run: pnpm --filter "./packages/*" run build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - run: pnpm publish -r --access public --no-git-checks --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npx changelogithub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
