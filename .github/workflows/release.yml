name: Release

permissions:
  contents: write
  id-token: write

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: npx changelogithub
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

      - run: pnpm i --filter . --filter "./packages/*" --frozen-lockfile --trust-lockfile
        env:
          PNPM_MINIMUM_RELEASE_AGE: 0

      # `@gscdump/engine` bundles ~20 entries via obuild; on the GitHub-hosted
      # ubuntu runner the default Node heap (~2 GB) OOM'd during v0.5.0, even
      # though the same build peaks at ~2.9 GB locally. Lift the cap so the
      # release isn't gated on heap pressure.
      # Build only publishable packages; the private `examples/nuxt-dashboard`
      # app (`nuxt build`) isn't released and adds minutes to every tag push.
      - run: pnpm --filter "./packages/*" run build
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      # Packages are already built above. Skip publish lifecycle scripts so
      # each package's `prepack` does not build the entire release a second
      # time.
      - run: pnpm publish -r --access public --no-git-checks --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{secrets.NPM_TOKEN}}
